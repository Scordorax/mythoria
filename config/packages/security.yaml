security:
  password_hashers:
    App\Entity\User:
      algorithm: auto

  providers:
    app_user_provider:
      entity:
        class: App\Entity\User
        property: email

  firewalls:
    # Route publique pour l'inscription
    register:
      pattern: ^/api/auth/register
      stateless: true
      security: false

    # Route publique pour le login (login géré par le controller)
    login:
      pattern: ^/api/auth/login
      stateless: true
      provider: app_user_provider

    # Toutes les autres routes API protégées par JWT
    api:
      pattern: ^/api
      stateless: true
      provider: app_user_provider
      jwt: ~

  access_control:
    - { path: ^/api/auth/register, roles: IS_AUTHENTICATED_ANONYMOUSLY }
    - { path: ^/api/auth/login, roles: IS_AUTHENTICATED_ANONYMOUSLY }
    - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }